spring.application.name=publisher-service
spring.main.web-application-type=none
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?sslMode=${MYSQL_SSL_MODE:VERIFY_IDENTITY}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:true}
spring.rabbitmq.ssl.validate-server-certificate=true
spring.rabbitmq.ssl.verify-hostname=true
spring.rabbitmq.requested-heartbeat=30s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
demo.create-order=${DEMO_CREATE_ORDER:true}
demo.scenario=${DEMO_SCENARIO:normal}
outbox.enabled=${OUTBOX_ENABLED:true}
outbox.delay-ms=2000
