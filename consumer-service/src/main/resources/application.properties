spring.application.name=consumer-service
spring.main.web-application-type=none
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE}?sslmode=${POSTGRES_SSL_MODE:verify-full}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:true}
spring.rabbitmq.ssl.validate-server-certificate=true
spring.rabbitmq.ssl.verify-hostname=true
spring.rabbitmq.requested-heartbeat=30s
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
demo.retry-invalid=${DEMO_RETRY_INVALID:false}
consumer.retry-delay-ms=500
